version: '3.8'

services:
  # Nginx Web Server Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voltgrid-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/voltgrid
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
      - mysql
    networks:
      - voltgrid-network

  # Yii2 Backend PHP 8.2-FPM Container
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltgrid-yii2-app
    restart: always
    environment:
      YII_ENV: dev
      YII_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: voltgrid_db
      DB_USER: voltgrid_user
      DB_PASS: voltgrid_secret_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./:/var/www/voltgrid
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - voltgrid-network

  # MySQL 8.0 Primary Relational Database
  mysql:
    image: mysql:8.0
    container_name: voltgrid-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass_2026
      MYSQL_DATABASE: voltgrid_db
      MYSQL_USER: voltgrid_user
      MYSQL_PASSWORD: voltgrid_secret_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltgrid-network

  # Redis for Push Notification Queue & Weather Cache
  redis:
    image: redis:7-alpine
    container_name: voltgrid-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - voltgrid-network

  # phpMyAdmin Web Database Manager
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: voltgrid-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - voltgrid-network

networks:
  voltgrid-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
