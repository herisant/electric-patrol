server {
    charset utf-8;
    client_max_body_size 32M;

    listen 80;
    server_name localhost;

    root        /var/www/voltgrid/web;
    index       index.php;

    access_log  /var/log/nginx/voltgrid_access.log;
    error_log   /var/log/nginx/voltgrid_error.log;

    location / {
        # Redirect everything that isn't a real file to index.php (Yii2 pretty URL)
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Deny accessing dotfiles
    location ~ /\.(ht|svn|git) {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php-fpm:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires max;
        log_not_found off;
    }
}
